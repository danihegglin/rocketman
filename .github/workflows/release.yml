# Tags and releases a new version whenever the version in Cargo.toml changes on main.
#
# To cut a release: bump `version` in Cargo.toml (and Cargo.lock) and merge to main.
# If tag v<version> does not exist yet, this builds the packages for every OS
# (see packages.yml), then creates the tag along with a GitHub release that has
# all of them attached and notes generated from the merged PRs since the
# previous tag. The tag and release are only created once every package has
# built, so a failed build leaves no half-filled release behind; re-run the
# workflow (or run it by hand) to retry.
name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          if [ -z "$version" ]; then
            echo "::error::Could not read package version from Cargo.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag is new
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Built here rather than in a separate `on: release` workflow because releases
  # created with GITHUB_TOKEN don't trigger other workflows.
  packages:
    needs: version
    if: needs.version.outputs.new == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -l dist
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes $prerelease dist/*

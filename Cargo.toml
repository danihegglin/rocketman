[package]
name = "rocketman"
version = "0.1.2"
edition = "2024"
description = "A fast, minimal HTTP client with OpenAPI collections"
license = "MIT"

[dependencies]
gpui-kit = { version = "0.8.1", features = ["tree-sitter"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
dirs = "7"
anyhow = "1"
futures = "0.3"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2

[package]
name = "rocketman"
version = "0.2.1"
edition = "2024"
description = "A fast, minimal HTTP client with OpenAPI collections"
license = "MIT"
default-run = "rocketman"

[lib]
path = "src/lib.rs"

# Desktop app (GPUI).
[[bin]]
name = "rocketman"
path = "src/main.rs"
required-features = ["desktop"]

# Terminal UI (ratatui).
[[bin]]
name = "rocketman-tui"
path = "src/tui/main.rs"
required-features = ["tui"]

[features]
default = ["desktop", "tui"]
desktop = ["dep:gpui-kit", "dep:futures"]
tui = ["dep:ratatui"]

[dependencies]
gpui-kit = { version = "0.8.1", features = ["tree-sitter"], optional = true }
ratatui = { version = "0.30", optional = true }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
dirs = "7"
anyhow = "1"
futures = { version = "0.3", optional = true }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
